<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uzbekistan Retail & Projects — Internal Intelligence</title>
<style>
:root{
  --stone-950:#18130f; --stone-900:#241b15; --stone-700:#4a4438; --stone-500:#8a8377; --stone-400:#a9a297;
  --stone-300:#d9d4c7; --stone-200:#eae6db; --stone-150:#f1ede3; --stone-100:#f7f4ee;
  --paper:#fffdfa; --brand:#9c4a2e; --brand-dark:#7c3a22; --brand-light:#c17148; --brand-ink:#ffffff; --brand-wash:#f3e4dc;
  --seg-a:#2a78d6; --seg-b:#eb6834; --seg-c:#1baf7a; --seg-d:#c98500; --seg-e:#d55181;
  --q-p1:#1a7d1a; --q-educate:#c98016; --q-develop:#4a3aa7; --q-low:#8a8377; --q-unsc:#b8b2a3;
  --line:#e4dfd0; --line-soft:#ece7d9;
  --shadow-sm:0 1px 2px rgba(24,19,15,.05);
  --shadow:0 1px 2px rgba(24,19,15,.04), 0 10px 28px -8px rgba(24,19,15,.13);
  --shadow-lift:0 6px 14px rgba(24,19,15,.09), 0 22px 44px -14px rgba(24,19,15,.24);
  --radius:12px; --radius-sm:8px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --grain:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44NSIgbnVtT2N0YXZlcz0iMiIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjxmZUNvbG9yTWF0cml4IHR5cGU9Im1hdHJpeCIgdmFsdWVzPSIwIDAgMCAwIDAgIDAgMCAwIDAgMCAgMCAwIDAgMCAwICAwIDAgMCAwLjA1IDAiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjbikiLz48L3N2Zz4K");
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); color:var(--stone-950);
  background-color:var(--stone-100);
  background-image:
    radial-gradient(1100px 560px at 102% -10%, var(--brand-wash) 0%, transparent 55%),
    radial-gradient(900px 520px at -8% 14%, rgba(138,131,119,.15) 0%, transparent 60%),
    var(--grain);
  background-repeat:no-repeat, no-repeat, repeat;
  background-attachment:fixed, fixed, fixed;
  -webkit-font-smoothing:antialiased; line-height:1.45;
}
::selection{background:var(--brand-wash)}
a{color:var(--brand)}
button{font-family:inherit}
.hidden{display:none !important}
.mono-num{font-variant-numeric:tabular-nums}
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
::-webkit-scrollbar{width:11px; height:11px}
::-webkit-scrollbar-track{background:var(--stone-100)}
::-webkit-scrollbar-thumb{background:var(--stone-300); border-radius:20px; border:3px solid var(--stone-100)}
::-webkit-scrollbar-thumb:hover{background:var(--stone-400)}

/* ---------- cover (partner) ---------- */
#cover{
  position:fixed; inset:0; z-index:60;
  background:
    radial-gradient(900px 520px at 50% -12%, rgba(193,113,72,.2), transparent 60%),
    var(--grain),
    linear-gradient(160deg, #201812 0%, var(--stone-950) 55%, #120d09 100%);
  background-repeat:no-repeat, repeat, no-repeat;
  color:var(--stone-100); display:flex; flex-direction:column; align-items:center;
  justify-content:center; text-align:center; padding:32px;
}
#cover::before{
  content:''; position:absolute; top:0; left:0; right:0; height:5px;
  background:linear-gradient(90deg, #3b342a 0%, #3b342a 32%, var(--brand) 32%, var(--brand-light) 66%, #cbb89a 66%, #cbb89a 100%);
}
#cover .brandmark{display:flex; gap:18px; align-items:center; margin-bottom:40px}
#cover .logo-slot{
  width:120px; height:56px; border:1px dashed rgba(245,242,238,.35); border-radius:6px;
  display:flex; align-items:center; justify-content:center; font-size:10px;
  letter-spacing:.06em; text-transform:uppercase; color:rgba(245,242,238,.55);
}
#cover .plus{color:rgba(245,242,238,.4); font-size:20px}
#cover h1{font-family:var(--font-display); font-weight:600; font-size:clamp(28px,4vw,44px); margin:0 0 12px; letter-spacing:-.005em; max-width:820px}
#cover .subtitle{font-size:16px; color:var(--stone-300); margin:0 0 28px}
#cover .meta{font-size:13px; color:var(--stone-400); margin-bottom:36px; letter-spacing:.02em}
#cover .confidential{
  max-width:520px; font-size:12.5px; color:var(--stone-400); border-top:1px solid rgba(245,242,238,.15);
  padding-top:18px; margin-bottom:28px; line-height:1.6;
}
#cover button{
  background:var(--brand); color:#fff; border:none; padding:13px 28px; border-radius:8px;
  font-size:14px; font-weight:700; letter-spacing:.02em; cursor:pointer;
  box-shadow:0 10px 24px -8px rgba(156,74,46,.55);
  transition:background .15s, transform .15s;
}
#cover button:hover{background:var(--brand-dark); transform:translateY(-1px)}

/* ---------- top chrome ---------- */
#topbar{
  position:sticky; top:0; z-index:40; color:#fff;
  background:
    linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0) 45%),
    linear-gradient(115deg, var(--stone-950) 0%, #241c15 65%, #2c2117 100%);
  padding:15px 22px 13px; display:flex; align-items:center; justify-content:space-between; gap:16px;
  box-shadow:0 1px 0 rgba(0,0,0,.35);
}
#topbar::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:4px;
  background:linear-gradient(90deg, #4a4438 0%, #4a4438 33%, var(--brand) 33%, var(--brand-light) 66%, #cbb89a 66%, #cbb89a 100%);
}
#topbar .brand-eyebrow{font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--brand-light); margin:0 0 3px; font-weight:700}
#topbar h1{font-family:var(--font-display); font-size:19px; font-weight:600; margin:0; letter-spacing:-.005em}
#topbar .pagesubtitle{font-size:11.5px; color:var(--stone-300); margin:5px 0 0; max-width:560px}
#topbar .modebadge{
  font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:3px 8px; border-radius:20px;
  border:1px solid rgba(245,242,238,.25); color:var(--stone-300); margin-left:10px;
}
#langtoggle{display:flex; gap:2px; background:rgba(245,242,238,.1); border-radius:8px; padding:2px}
#langtoggle button{
  border:none; background:transparent; color:var(--stone-300); padding:6px 12px; border-radius:6px;
  font-size:12.5px; font-weight:700; cursor:pointer; letter-spacing:.02em;
}
#langtoggle button.active{background:#fff; color:var(--stone-950)}

/* ---------- KPI strip ---------- */
#kpistrip{display:flex; gap:14px; flex-wrap:wrap; padding:18px 22px 4px; max-width:1360px; margin:0 auto}
.kpi{
  flex:1 1 160px; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
  padding:15px 18px 15px 20px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden;
}
.kpi::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--brand)}
.kpi:nth-child(2)::before{background:var(--seg-c)}
.kpi:nth-child(3)::before{background:var(--q-p1)}
.kpi:nth-child(4)::before{background:var(--seg-a)}
.kpi .label{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--stone-500); margin:0 0 6px; font-weight:600}
.kpi .value{font-family:var(--font-display); font-size:27px; font-weight:600; letter-spacing:-.01em}

/* ---------- filter bar ---------- */
#filterbar{
  position:sticky; top:var(--topbar-h,62px); z-index:30; background:var(--stone-150);
  border-bottom:1px solid var(--line); border-top:1px solid var(--line-soft);
  padding:13px 22px; display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end;
}
#filterbar .fgroup{display:flex; flex-direction:column; gap:4px}
#filterbar label{font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--stone-500); font-weight:700}
#filterbar select,#filterbar input[type=number]{
  font-family:inherit; font-size:12.5px; padding:7px 26px 7px 10px; border:1px solid var(--stone-300);
  border-radius:var(--radius-sm); background-color:var(--paper); color:var(--stone-950); min-width:120px;
  appearance:none; -webkit-appearance:none; transition:border-color .12s, box-shadow .12s;
}
#filterbar select{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0L5 6L10 0Z' fill='%238a8377'/></svg>");
  background-repeat:no-repeat; background-position:right 10px center; background-size:9px 6px;
}
#filterbar input[type=number]{padding:7px 8px; min-width:0}
#filterbar select:hover,#filterbar input[type=number]:hover{border-color:var(--stone-400)}
#filterbar select:focus,#filterbar input[type=number]:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-wash)}
#filterbar .range-inputs{display:flex; gap:5px; align-items:center; font-size:12px; color:var(--stone-500)}
#filterbar .range-inputs input{width:46px; min-width:46px; text-align:center}
#resetfilters{
  font-size:12px; font-weight:700; color:var(--brand); background:none; border:none; cursor:pointer;
  padding:8px 6px; align-self:flex-end;
}
#resetfilters:hover{text-decoration:underline}
#filtercount{font-size:11.5px; color:var(--stone-500); align-self:flex-end; padding-bottom:8px; white-space:nowrap}
#exportcsv{
  margin-left:auto; align-self:flex-end; display:inline-flex; align-items:center; gap:8px;
  background:var(--brand); color:#fff; border:none; padding:9px 16px; border-radius:var(--radius-sm);
  font-size:12.8px; font-weight:700; letter-spacing:.01em; cursor:pointer; white-space:nowrap;
  box-shadow:0 6px 16px -6px rgba(156,74,46,.6); transition:background .15s, transform .15s;
}
#exportcsv:hover{background:var(--brand-dark); transform:translateY(-1px)}
#exportcsv::before{content:'\2193'; font-weight:800}

/* ---------- tabs ---------- */
#tabs{display:flex; gap:4px; padding:0 22px; background:var(--paper); border-bottom:1px solid var(--line); overflow-x:auto}
#tabs button{
  border:none; background:none; padding:13px 16px; font-size:13px; font-weight:600; color:var(--stone-500);
  cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; transition:color .12s;
}
#tabs button:hover{color:var(--stone-700)}
#tabs button.active{color:var(--stone-950); border-bottom-color:var(--brand); font-weight:700}

/* ---------- content ---------- */
#content{padding:26px 22px 64px; max-width:1360px; margin:0 auto}
.panel{display:none}
.panel.active{display:block; animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0; transform:translateY(3px)} to{opacity:1; transform:none}}
.section-head{margin:0 0 18px}
.section-head h2{font-family:var(--font-display); font-size:21px; font-weight:600; margin:0 0 5px; letter-spacing:-.005em}
.section-head p{font-size:13px; color:var(--stone-700); margin:0; max-width:760px}

/* ---------- cards / grid ---------- */
.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.grid-2{display:grid; grid-template-columns:minmax(0,2.1fr) minmax(280px,1fr); gap:18px; align-items:start}
@media (max-width:900px){.grid-2{grid-template-columns:1fr}}

/* ---------- scatter map ---------- */
#mapcard{padding:20px}
#mapsvgwrap{position:relative}
svg#scatter{width:100%; height:auto; display:block}
.axis-label{font-size:11px; fill:var(--stone-500); letter-spacing:.03em}
.quad-label{font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase}
.gridline{stroke:var(--stone-200); stroke-width:1}
.axisline{stroke:var(--stone-300); stroke-width:1}
.dot{cursor:pointer; stroke:#fff; stroke-width:2}
.dot:hover, .dot.hovered{filter:brightness(0.85)}
.hit{fill:transparent; cursor:pointer}
#tooltip{
  position:absolute; pointer-events:none; background:var(--stone-950); color:#fff; font-size:12px;
  padding:10px 12px; border-radius:9px; max-width:240px; box-shadow:var(--shadow-lift); z-index:50; opacity:0;
  transition:opacity .08s;
}
#tooltip.show{opacity:1}
#tooltip .tt-name{font-family:var(--font-display); font-weight:600; font-size:13px; margin-bottom:4px}
#tooltip .tt-row{color:var(--stone-300); font-size:11.3px}

.legend{display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:16px; padding-top:16px; border-top:1px solid var(--line)}
.legend-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--stone-700)}
.legend-swatch{width:12px; height:12px; flex:none}

.unscored-strip{margin-top:16px; padding-top:16px; border-top:1px dashed var(--stone-300)}
.unscored-strip h4{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--stone-500); margin:0 0 8px; font-weight:700}
.chip-row{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  font-size:11.5px; padding:5px 10px; border-radius:20px; background:var(--stone-150); color:var(--stone-700);
  cursor:pointer; border:1px solid var(--stone-200); transition:background .12s, transform .12s;
}
.chip:hover{background:var(--stone-200); transform:translateY(-1px)}

/* ---------- detail drawer ---------- */
#drawer{
  position:fixed; top:0; right:0; height:100%; width:min(440px,92vw); background:var(--paper);
  box-shadow:-12px 0 36px rgba(24,19,15,.22); transform:translateX(100%); transition:transform .2s ease;
  z-index:55; overflow-y:auto; padding:26px;
}
#drawer.open{transform:translateX(0)}
#drawerbg{position:fixed; inset:0; background:rgba(24,19,15,.32); z-index:54; opacity:0; pointer-events:none; transition:opacity .2s}
#drawerbg.open{opacity:1; pointer-events:auto}
#drawer .dclose{position:absolute; top:18px; right:18px; border:none; background:var(--stone-150); width:32px; height:32px; border-radius:50%; font-size:16px; cursor:pointer; color:var(--stone-700); transition:background .12s}
#drawer .dclose:hover{background:var(--stone-200)}
#drawer .dname{font-family:var(--font-display); font-size:20px; font-weight:600; margin:0 30px 4px 0; letter-spacing:-.005em}
#drawer .dmeta{font-size:12.5px; color:var(--stone-500); margin-bottom:18px}
#drawer .dsection{margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--line)}
#drawer .dsection:last-child{border-bottom:none}
#drawer .dlabel{font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--stone-500); margin:0 0 4px; font-weight:700}
#drawer .dval{font-size:13.5px; color:var(--stone-950)}
#drawer .dscorepair{display:flex; gap:10px}
#drawer .dscorebox{flex:1; background:var(--stone-100); border:1px solid var(--line-soft); border-radius:var(--radius-sm); padding:11px}
#drawer .dscorebox .num{font-family:var(--font-display); font-size:23px; font-weight:600}
.badge{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.03em; padding:4px 10px; border-radius:20px; color:#fff}

/* ---------- city / segment views ---------- */
.city-grid,.seg-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px}
.city-card,.seg-card{padding:18px; cursor:pointer; transition:box-shadow .15s, transform .15s}
.city-card:hover,.seg-card:hover{box-shadow:var(--shadow-lift); transform:translateY(-2px)}
.city-card h3,.seg-card h3{font-family:var(--font-display); font-size:16px; margin:0 0 2px; font-weight:600}
.city-card .n,.seg-card .n{font-family:var(--font-display); font-size:26px; font-weight:600; color:var(--brand)}
.bar-row{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:11.5px}
.bar-row .barlabel{width:82px; flex:none; color:var(--stone-500); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bar-track{flex:1; height:7px; background:var(--stone-150); border-radius:4px; overflow:hidden}
.bar-fill{height:100%; border-radius:4px}

/* ---------- competitive ---------- */
.comp-table{width:100%; border-collapse:collapse; font-size:13px}
.comp-table th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--stone-500); padding:10px 12px; border-bottom:1px solid var(--line); font-weight:700}
.comp-table td{padding:10px 12px; border-bottom:1px solid var(--stone-150)}
.comp-table tr:hover td{background:var(--stone-100)}

/* ---------- action plan table ---------- */
#actiontable-wrap{overflow-x:auto}
table#actiontable{width:100%; border-collapse:collapse; font-size:12.8px; min-width:980px}
table#actiontable th{
  text-align:left; font-size:10.3px; text-transform:uppercase; letter-spacing:.04em; color:var(--stone-500);
  padding:11px 12px; border-bottom:1px solid var(--line); cursor:pointer; white-space:nowrap; user-select:none;
  position:sticky; top:0; background:var(--paper); font-weight:700;
}
table#actiontable th:hover{color:var(--stone-950)}
table#actiontable th .arrow{font-size:9px; margin-left:2px; opacity:.5}
table#actiontable td{padding:10px 12px; border-bottom:1px solid var(--stone-150); vertical-align:top}
table#actiontable tr:hover td{background:var(--stone-100)}
.actiontext{max-width:340px; font-size:12.3px; color:var(--stone-700)}
.toolrow{display:flex; justify-content:flex-end; align-items:center; margin-bottom:12px; gap:10px; flex-wrap:wrap}
#tablecount{font-size:12px; color:var(--stone-500)}

/* ---------- footer ---------- */
#pagefoot{padding:28px 22px 44px; max-width:1360px; margin:0 auto; font-size:11.5px; color:var(--stone-500); border-top:1px solid var(--line)}
#pagefoot .confid{color:var(--brand); font-weight:700; margin-bottom:6px}

@media (max-width:860px){
  /* a multi-row filter bar must not stay pinned to the top while scrolling on a phone */
  #filterbar{position:static; top:auto}
}
@media (max-width:640px){
  #topbar{padding:13px 14px 12px} #filterbar{padding:12px 14px} #content{padding:18px 14px 50px}
  #kpistrip{padding:14px 14px 2px}
  .grid-2{gap:12px}
  #filterbar .fgroup{width:100%}
  #filterbar select{width:100%}
  #filterbar select,#filterbar input[type=number],#resetfilters,#tabs button{min-height:40px}
  #exportcsv{margin-left:0; width:100%; justify-content:center; min-height:44px}
  #resetfilters,#filtercount{align-self:flex-start; padding-bottom:0}
  #drawer{padding:22px 18px}
  table#actiontable td, table#actiontable th{padding:10px 8px}
}
@media (hover:none) and (pointer:coarse){
  .chip{padding:7px 12px}
  #tabs button{padding:14px 16px}
}
@media (prefers-reduced-motion:reduce){
  .panel.active{animation:none}
  *{transition-duration:.001ms !important; scroll-behavior:auto !important}
}
</style>
</head>
<body>

<div id="tooltip"></div>

<div id="drawerbg" onclick="closeDrawer()"></div>
<aside id="drawer"></aside>

<header id="topbar">
  <div>
    <p class="brand-eyebrow">Cosentino &middot; Dekton / Silestone / Sensa</p>
    <h1 id="pagetitle"></h1>
    <p class="pagesubtitle" data-i18n="page_subtitle"></p>
  </div>
  <div style="display:flex; align-items:center; gap:14px">
    <span class="modebadge" id="modebadge"></span>
    <div id="langtoggle">
      <button data-lang="en" onclick="setLang('en')">EN</button>
      <button data-lang="ru" onclick="setLang('ru')">RU</button>
    </div>
  </div>
</header>

<div id="kpistrip">
  <div class="kpi"><p class="label" data-i18n="kpi_total"></p><p class="value mono-num" id="kpi_total"></p></div>
  <div class="kpi"><p class="label" data-i18n="kpi_showroom"></p><p class="value mono-num" id="kpi_showroom"></p></div>
  <div class="kpi"><p class="label" data-i18n="kpi_priority1"></p><p class="value mono-num" id="kpi_priority1"></p></div>
  <div class="kpi"><p class="label" data-i18n="kpi_cities"></p><p class="value mono-num" id="kpi_cities"></p></div>
</div>

<div id="filterbar">
  <div class="fgroup"><label data-i18n="filter_city"></label>
    <select id="f_city" onchange="onFilterChange()"></select></div>
  <div class="fgroup"><label data-i18n="filter_typology"></label>
    <select id="f_typology" onchange="onFilterChange()"></select></div>
  <div class="fgroup"><label data-i18n="filter_segment"></label>
    <select id="f_segment" onchange="onFilterChange()"></select></div>
  <div class="fgroup"><label data-i18n="filter_quadrant"></label>
    <select id="f_quadrant" onchange="onFilterChange()"></select></div>
  <div class="fgroup"><label data-i18n="filter_brand"></label>
    <select id="f_brand" onchange="onFilterChange()"></select></div>
  <div class="fgroup"><label data-i18n="filter_x"></label>
    <div class="range-inputs">
      <input type="number" id="f_xmin" min="1" max="5" placeholder="1" onchange="onFilterChange()">–
      <input type="number" id="f_xmax" min="1" max="5" placeholder="5" onchange="onFilterChange()">
    </div></div>
  <div class="fgroup"><label data-i18n="filter_y"></label>
    <div class="range-inputs">
      <input type="number" id="f_ymin" min="1" max="5" placeholder="1" onchange="onFilterChange()">–
      <input type="number" id="f_ymax" min="1" max="5" placeholder="5" onchange="onFilterChange()">
    </div></div>

const state = { lang: CONFIG.defaultLang, tab: 'map', filters: { city:'', typology:'', segment:'', quadrant:'', brand:'', xmin:'', xmax:'', ymin:'', ymax:'', complete:'' } };

function t(key){ const d = I18N[state.lang] || I18N.en; return (key in d) ? d[key] : (I18N.en[key]||key); }

const SEG_META = {
  'A': { color:'var(--seg-a)', shape:'circle' },
  'B': { color:'var(--seg-b)', shape:'square' },
  'C': { color:'var(--seg-c)', shape:'triangle' },
  'D': { color:'var(--seg-d)', shape:'diamond' },
  'E': { color:'var(--seg-e)', shape:'cross' },
};
function segKey(rec){ return (rec.segment_en||'').charAt(0); }
function segMeta(rec){ return SEG_META[segKey(rec)] || {color:'var(--stone-500)', shape:'circle'}; }

function quadKey(rec){
  const q = rec.quadrant_en || '';
  if (q.indexOf('PRIORITY 1') === 0) return 'p1';
  if (q.indexOf('EDUCATE') === 0) return 'educate';
  if (q.indexOf('DEVELOP') === 0) return 'develop';
  if (q === 'LOW PRIORITY') return 'low';
  return 'unscored';
}
const QUAD_COLOR = { p1:'var(--q-p1)', educate:'var(--q-educate)', develop:'var(--q-develop)', low:'var(--q-low)', unscored:'var(--q-unsc)' };
function quadLabel(rec){
  const k = quadKey(rec);
  if (k === 'low') return CONFIG.mode === 'partner' ? t('quad_low_partner') : t('quad_low_internal');
  return t('quad_' + k);
}

function potentialSize(rec){
  const p = (rec.potential_en||'Medium');
  return p === 'High' ? 9 : (p === 'Low' ? 5 : 7);
}

// deterministic pseudo-random jitter, stable per record id so re-renders don't shuffle points
function seededRand(seed){
  let x = Math.sin(seed * 999.77) * 10000;
  return x - Math.floor(x);
}
function jitter(id, axisSalt){
  return (seededRand(id * 7 + axisSalt) - 0.5) * 0.62;
}

function brandTierLabel(tier){
  if (tier === 'direct') return t('tier_direct');
  if (tier === 'adjacent') return t('tier_adjacent');
  if (tier === 'cosentino_ref') return t('tier_cosentino_ref');
  if (tier === 'other') return t('tier_other');
  return null;
}

function showroomLabel(flag){
  return { yes:t('show_yes'), uncertain:t('show_uncertain'), no:t('show_no'), not_yet:t('show_notyet') }[flag] || t('show_no');
}

// ---------- filters ----------
function uniqueSorted(arr){ return [...new Set(arr)].filter(Boolean).sort(); }

function populateFilterOptions(){
  const bySel = (id, values, labelFn) => {
    const sel = document.getElementById(id);
    const cur = sel.value;
    sel.innerHTML = '';
    const optAll = document.createElement('option'); optAll.value=''; optAll.textContent = t('opt_all');
    sel.appendChild(optAll);
    values.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = labelFn ? labelFn(v) : v; sel.appendChild(o); });
    sel.value = cur && values.includes(cur) ? cur : '';
  };
  bySel('f_city', uniqueSorted(DATA.map(r => r.city_en)), v => (state.lang==='ru' ? (DATA.find(r=>r.city_en===v)||{}).city_ru : v) || v);
  bySel('f_typology', uniqueSorted(DATA.map(r => r.typology_en)), v => { const r = DATA.find(x=>x.typology_en===v); return state.lang==='ru' ? r.typology_ru : v; });
  bySel('f_segment', uniqueSorted(DATA.map(r => r.segment_en)), v => { const r = DATA.find(x=>x.segment_en===v); return state.lang==='ru' ? r.segment_ru : v; });
  const quadKeys = ['p1','educate','develop','low','unscored'];
  const qsel = document.getElementById('f_quadrant');
  const curQ = qsel.value; qsel.innerHTML='';
  const oAll = document.createElement('option'); oAll.value=''; oAll.textContent=t('opt_all'); qsel.appendChild(oAll);
  quadKeys.forEach(k => { const o = document.createElement('option'); o.value=k;
    o.textContent = k==='low' ? (CONFIG.mode==='partner'?t('quad_low_partner'):t('quad_low_internal')) : t('quad_'+k);
    qsel.appendChild(o); });
  qsel.value = quadKeys.includes(curQ) ? curQ : '';

  const bsel = document.getElementById('f_brand');
  const curB = bsel.value; bsel.innerHTML='';
  const bAll = document.createElement('option'); bAll.value=''; bAll.textContent=t('opt_all'); bsel.appendChild(bAll);
  [['direct',t('tier_direct')],['adjacent',t('tier_adjacent')],['cosentino_ref',t('tier_cosentino_ref')]].forEach(([v,l])=>{
    const o=document.createElement('option'); o.value=v; o.textContent=l; bsel.appendChild(o);
  });
  bsel.value = curB || '';
}

function applyFilters(){
  const f = state.filters;
  return DATA.filter(r => {
    if (f.city && r.city_en !== f.city) return false;
    if (f.typology && r.typology_en !== f.typology) return false;
    if (f.segment && r.segment_en !== f.segment) return false;
    if (f.quadrant && quadKey(r) !== f.quadrant) return false;
    if (f.brand && r.brand_tier !== f.brand) return false;
    if (f.xmin !== '' && (r.x === null || r.x < +f.xmin)) return false;
    if (f.xmax !== '' && (r.x === null || r.x > +f.xmax)) return false;
    if (f.ymin !== '' && (r.y === null || r.y < +f.ymin)) return false;
    if (f.ymax !== '' && (r.y === null || r.y > +f.ymax)) return false;
    if (f.complete !== '' && r.completeness < +f.complete) return false;
    return true;
  });
}

function onFilterChange(){
  state.filters.city = document.getElementById('f_city').value;
  state.filters.typology = document.getElementById('f_typology').value;
  state.filters.segment = document.getElementById('f_segment').value;
  state.filters.quadrant = document.getElementById('f_quadrant').value;
  state.filters.brand = document.getElementById('f_brand').value;
  state.filters.xmin = document.getElementById('f_xmin').value;
  state.filters.xmax = document.getElementById('f_xmax').value;
  state.filters.ymin = document.getElementById('f_ymin').value;
  state.filters.ymax = document.getElementById('f_ymax').value;
  state.filters.complete = document.getElementById('f_complete').value;
  render();
}

function resetFilters(){
  ['f_city','f_typology','f_segment','f_quadrant','f_brand','f_xmin','f_xmax','f_ymin','f_ymax','f_complete'].forEach(id=>{
    document.getElementById(id).value = '';
  });
  state.filters = { city:'', typology:'', segment:'', quadrant:'', brand:'', xmin:'', xmax:'', ymin:'', ymax:'', complete:'' };
  render();
}

function renderKPI(filtered){
  document.getElementById('kpi_total').textContent = filtered.length;
  document.getElementById('kpi_showroom').textContent = filtered.filter(r=>r.showroom_flag==='yes').length;
  document.getElementById('kpi_priority1').textContent = filtered.filter(r=>quadKey(r)==='p1').length;

  document.getElementById('filtercount').textContent = filtered.length + ' / ' + DATA.length;
}

// ---------- Positioning map (SVG scatter) ----------
const MAPW = 640, MAPH = 460, MARGIN = {l:44, r:18, t:18, b:44};
const PLOTW = MAPW - MARGIN.l - MARGIN.r, PLOTH = MAPH - MARGIN.t - MARGIN.b;
const DOMAIN_MIN = 0.5, DOMAIN_MAX = 5.5;

function sx(v){ return MARGIN.l + (v - DOMAIN_MIN) / (DOMAIN_MAX - DOMAIN_MIN) * PLOTW; }
function sy(v){ return MARGIN.t + PLOTH - (v - DOMAIN_MIN) / (DOMAIN_MAX - DOMAIN_MIN) * PLOTH; }

function shapePath(shape, cx, cy, r){
  if (shape === 'circle') return '<circle class="dot" cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="COLOR"></circle>';
  if (shape === 'square'){ const s=r*1.6; return '<rect class="dot" x="'+(cx-s/2)+'" y="'+(cy-s/2)+'" width="'+s+'" height="'+s+'" rx="1.5" fill="COLOR"></rect>'; }
  if (shape === 'triangle'){ const s=r*1.9; const p=[[cx,cy-s*0.62],[cx-s*0.58,cy+s*0.5],[cx+s*0.58,cy+s*0.5]]; return '<polygon class="dot" points="'+p.map(pt=>pt.join(',')).join(' ')+'" fill="COLOR"></polygon>'; }
  if (shape === 'diamond'){ const s=r*1.35; const p=[[cx,cy-s],[cx+s,cy],[cx,cy+s],[cx-s,cy]]; return '<polygon class="dot" points="'+p.map(pt=>pt.join(',')).join(' ')+'" fill="COLOR"></polygon>'; }
  if (shape === 'cross'){ const s=r*0.95; return '<g class="dot" fill="COLOR"><rect x="'+(cx-s)+'" y="'+(cy-s*0.34)+'" width="'+(s*2)+'" height="'+(s*0.68)+'" rx="1"></rect><rect x="'+(cx-s*0.34)+'" y="'+(cy-s)+'" width="'+(s*0.68)+'" height="'+(s*2)+'" rx="1"></rect></g>'; }
  return '';
}

function renderMap(filtered){
  const scored = filtered.filter(r => r.x !== null && r.y !== null);
  const unscored = filtered.filter(r => r.x === null || r.y === null);

  let svg = '<svg id="scatter" viewBox="0 0 '+MAPW+' '+MAPH+'" xmlns="http://www.w3.org/2000/svg">';

  // quadrant background zones
  const midX = sx(3.5), midY = sy(3.5);
  const zones = [
    {x:MARGIN.l, y:MARGIN.t, w:midX-MARGIN.l, h:midY-MARGIN.t, key:'develop'},
    {x:midX, y:MARGIN.t, w:MARGIN.l+PLOTW-midX, h:midY-MARGIN.t, key:'p1'},
    {x:MARGIN.l, y:midY, w:midX-MARGIN.l, h:MARGIN.t+PLOTH-midY, key:'low'},
    {x:midX, y:midY, w:MARGIN.l+PLOTW-midX, h:MARGIN.t+PLOTH-midY, key:'educate'},
  ];
  zones.forEach(z => {
    svg += '<rect x="'+z.x+'" y="'+z.y+'" width="'+z.w+'" height="'+z.h+'" fill="'+QUAD_COLOR[z.key]+'" opacity="0.07"></rect>';
  });
  // gridlines at integers
  for (let i=1;i<=5;i++){
    svg += '<line class="gridline" x1="'+sx(i)+'" y1="'+MARGIN.t+'" x2="'+sx(i)+'" y2="'+(MARGIN.t+PLOTH)+'"></line>';
    svg += '<line class="gridline" x1="'+MARGIN.l+'" y1="'+sy(i)+'" x2="'+(MARGIN.l+PLOTW)+'" y2="'+sy(i)+'"></line>';
    svg += '<text class="axis-label" x="'+sx(i)+'" y="'+(MARGIN.t+PLOTH+16)+'" text-anchor="middle">'+i+'</text>';
    svg += '<text class="axis-label" x="'+(MARGIN.l-9)+'" y="'+(sy(i)+3)+'" text-anchor="end">'+i+'</text>';
  }
  // axis lines + labels
  svg += '<line class="axisline" x1="'+MARGIN.l+'" y1="'+(MARGIN.t+PLOTH)+'" x2="'+(MARGIN.l+PLOTW)+'" y2="'+(MARGIN.t+PLOTH)+'"></line>';
  svg += '<line class="axisline" x1="'+MARGIN.l+'" y1="'+MARGIN.t+'" x2="'+MARGIN.l+'" y2="'+(MARGIN.t+PLOTH)+'"></line>';
  svg += '<text class="axis-label" x="'+(MARGIN.l+PLOTW/2)+'" y="'+(MAPH-6)+'" text-anchor="middle">'+t('axis_x')+'</text>';
  svg += '<text class="axis-label" x="-'+(MARGIN.t+PLOTH/2)+'" y="13" text-anchor="middle" transform="rotate(-90)">'+t('axis_y')+'</text>';
  // quadrant corner labels
  svg += '<text class="quad-label" x="'+(midX+8)+'" y="'+(MARGIN.t+14)+'" fill="'+QUAD_COLOR.p1+'">'+t('quad_p1').toUpperCase()+'</text>';
  svg += '<text class="quad-label" x="'+(MARGIN.l+8)+'" y="'+(MARGIN.t+14)+'" fill="'+QUAD_COLOR.develop+'">'+t('quad_develop').toUpperCase()+'</text>';
  svg += '<text class="quad-label" x="'+(midX+8)+'" y="'+(MARGIN.t+PLOTH-8)+'" fill="'+QUAD_COLOR.educate+'">'+t('quad_educate').toUpperCase()+'</text>';
  svg += '<text class="quad-label" x="'+(MARGIN.l+8)+'" y="'+(MARGIN.t+PLOTH-8)+'" fill="'+QUAD_COLOR.low+'">'+(CONFIG.mode==='partner'?t('quad_low_partner'):t('quad_low_internal')).toUpperCase()+'</text>';

  scored.forEach(r => {
    const jx = Math.max(1, Math.min(5, r.x + jitter(r.id, 1)));
    const jy = Math.max(1, Math.min(5, r.y + jitter(r.id, 2)));
    const cx = sx(jx), cy = sy(jy);
    const meta = segMeta(r);
    const rad = potentialSize(r);
    svg += shapePath(meta.shape, cx, cy, rad).replace('COLOR', meta.color).replace(/class="dot"/, 'class="dot" data-id="'+r.id+'"');
    svg += '<circle class="hit" data-id="'+r.id+'" cx="'+cx+'" cy="'+cy+'" r="14"></circle>';
  });
  svg += '</svg>';
  document.getElementById('mapsvgwrap').innerHTML = svg;

  // legend (segments, with shape glyphs -> shape carries identity, color is secondary)
  let leg = '<div style="width:100%; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--stone-500); margin-bottom:4px">' + t('filter_segment') + '</div>';
  uniqueSorted(DATA.map(r=>r.segment_en)).forEach(segEn => {
    const rec0 = DATA.find(r=>r.segment_en===segEn);
    const meta = segMeta(rec0);
    const label = state.lang==='ru' ? rec0.segment_ru : segEn;
    leg += '<div class="legend-item"><svg width="13" height="13" class="legend-swatch">'+shapePath(meta.shape,6.5,6.5,5).replace('COLOR',meta.color).replace('class="dot"','')+'</svg>'+label+'</div>';
  });
  document.getElementById('maplegend').innerHTML = leg;

  // quadrant "how to read" panel
  const qorder = ['p1','educate','develop','low'];
  let ql = '';
  qorder.forEach(k => {
    const label = k==='low' ? (CONFIG.mode==='partner'?t('quad_low_partner'):t('quad_low_internal')) : t('quad_'+k);
    ql += '<div style="display:flex; gap:8px; align-items:flex-start; margin-bottom:12px">'
        + '<span style="width:10px;height:10px;border-radius:2px;background:'+QUAD_COLOR[k]+';margin-top:3px;flex:none"></span>'
        + '<span style="font-size:12.5px; color:var(--stone-700)">'+label+'</span></div>';
  });
  document.getElementById('quadrantlegend').innerHTML = ql;

  // unscored chips
  document.getElementById('unscoredchips').innerHTML = unscored.map(r =>
    '<span class="chip" data-id="'+r.id+'">'+escapeHtml(r.name)+'</span>'
  ).join('') || '<span style="font-size:12px;color:var(--stone-400)">'+t('opt_all')+' 0</span>';

  // interactions
  document.querySelectorAll('#scatter .hit').forEach(el => {
    el.addEventListener('pointerenter', (e) => showTooltip(e, +el.dataset.id));
    el.addEventListener('pointermove', (e) => moveTooltip(e));
    el.addEventListener('pointerleave', hideTooltip);
    el.addEventListener('click', () => openDrawer(+el.dataset.id));
    el.addEventListener('focus', (e) => showTooltip(e, +el.dataset.id));
  });
  document.querySelectorAll('.unscored-strip .chip').forEach(el => {
    el.addEventListener('click', () => openDrawer(+el.dataset.id));
  });
}

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = (s==null?'':String(s)); return d.innerHTML;
}

function showTooltip(e, id){
  const r = DATA.find(x=>x.id===id); if(!r) return;
  const tip = document.getElementById('tooltip');
  const nameEl = document.createElement('div'); nameEl.className='tt-name'; nameEl.textContent = r.name;
  const row1 = document.createElement('div'); row1.className='tt-row'; row1.textContent = (state.lang==='ru'?r.city_ru:r.city_en) + ' · ' + (state.lang==='ru'?r.segment_ru:r.segment_en);
  const row2 = document.createElement('div'); row2.className='tt-row'; row2.textContent = 'X '+(r.x??'—')+' · Y '+(r.y??'—') + ' · ' + quadLabel(r);
  tip.innerHTML=''; tip.appendChild(nameEl); tip.appendChild(row1); tip.appendChild(row2);
  tip.classList.add('show');
  moveTooltip(e);
}
function moveTooltip(e){
  const tip = document.getElementById('tooltip');
  const wrap = document.getElementById('mapsvgwrap').getBoundingClientRect();
  let x = e.clientX - wrap.left + 14, y = e.clientY - wrap.top + 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTooltip(){ document.getElementById('tooltip').classList.remove('show'); }

// ---------- Action plan ----------
let sortState = { key: 'quadrant', dir: 1 };
const QUAD_ORDER = { p1:0, educate:1, develop:2, low:3, unscored:4 };

function sortRows(rows){
  const k = sortState.key, dir = sortState.dir;
  return [...rows].sort((a,b) => {
    let va, vb;
    if (k==='quadrant'){ va = QUAD_ORDER[quadKey(a)]; vb = QUAD_ORDER[quadKey(b)]; }
    else if (k==='name'){ va=a.name; vb=b.name; }
    else if (k==='city'){ va=state.lang==='ru'?a.city_ru:a.city_en; vb=state.lang==='ru'?b.city_ru:b.city_en; }
    else if (k==='segment'){ va=state.lang==='ru'?a.segment_ru:a.segment_en; vb=state.lang==='ru'?b.segment_ru:b.segment_en; }
    if (va < vb) return -1*dir; if (va > vb) return 1*dir; return 0;
  });
}

function renderAction(filtered){
  const rows = sortRows(filtered);
  document.getElementById('tablecount').textContent = rows.length + ' / ' + DATA.length;
  const cols = [['name','action_th_name'],['city','action_th_city'],['segment','action_th_segment'],['quadrant','action_th_quadrant']];

    head += '<th onclick="onSort(\''+key+'\')">'+t(label)+' <span class="arrow">'+arrow+'</span></th>';

function csvEscape(v){
  const s = (v==null?'':String(v));
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
async function exportCSV(){
  const rows = sortRows(applyFilters());
  const headers = ['name','city','segment','typology','channel','quadrant','x','y','brands','action','email','phone','web'];
  const lines = [headers.join(',')];
  rows.forEach(r => {
    const qk = quadKey(r);
    const qlabel = qk==='low' ? (CONFIG.mode==='partner'?t('quad_low_partner'):t('quad_low_internal')) : t('quad_'+qk);
    lines.push([
      r.name, state.lang==='ru'?r.city_ru:r.city_en, state.lang==='ru'?r.segment_ru:r.segment_en,
      state.lang==='ru'?r.typology_ru:r.typology_en, state.lang==='ru'?r.channel_ru:r.channel_en,
      qlabel, r.x??'', r.y??'', r.brands||'', state.lang==='ru'?r.action_ru:r.action_en,
      r.email||'', r.phone||'', r.web||''
    ].map(csvEscape).join(','));
  });
  const csvText = '﻿' + lines.join('\r\n');
  const filename = 'cosentino_uzbekistan_action_plan_' + CONFIG.mode + '.csv';

  // Published-artifact viewers can't trigger a plain <a download> — offer the file
  // through the host's downloads capability there, and fall back to the classic
  // blob/anchor trick when this file is just opened directly in a browser.
  if (window.claude && typeof window.claude.use === 'function'){
    try {
      const downloads = await window.claude.use('downloads');
      if (downloads){
        try {
          await downloads.save({ filename, data: csvText });
          return;
        } catch(err){
          if (err && err.code === 'extension_not_enabled'){
            try { await downloads.save({ filename: filename.replace(/\.csv$/, '.txt'), data: csvText }); return; } catch(e2){ /* fall through */ }
          } else if (err && err.code === 'declined'){
            return;
          }
        }
      }
    } catch(e){ /* fall through to classic download */ }
  }

  const blob = new Blob([csvText], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  populateFilterOptions();
  applyStaticI18n();
  syncTopbarHeight();
  setTab('map');
}
document.addEventListener('DOMContentLoaded', init);
window.addEventListener('resize', syncTopbarHeight);

</script>
